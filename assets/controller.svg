<title id="title">PlayStation-style controller guide</title><desc id="desc">L2 aim, R2 fire, L1 pulse, R1 grenade. Left stick move and sprint. Right stick look and melee. Cross jump, Circle crouch, Square reload or interact, Triangle switch weapon, Options pause.</desc>
